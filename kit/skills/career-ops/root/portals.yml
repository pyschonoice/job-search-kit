# career-ops scanner config for the user (read by tools/career-ops/scan.mjs via CAREER_OPS_ROOT).
# Filters mirror .claude/skills/job-hunt/references/search.json (title_include / title_exclude / location_ok).
# Add a company: one tracked_companies entry with its ATS careers_url (Greenhouse, Ashby, Lever, Workable,
# Rippling, SmartRecruiters, Workday, Zoho Recruit, Recruitee, BambooHR, Breezy... see
# tools/career-ops/templates/portals.example.yml "Provider auto-detection"). Keka and Darwinbox are not supported.

scan_history:
  recheck_after_days: 7

max_posting_age_days: 30

title_filter:
  positive:
    - "ai engineer"
    - "genai"
    - "gen ai"
    - "generative ai"
    - "llm"
    - "ml engineer"
    - "machine learning engineer"
    - "applied ai"
    - "agent"
    - "backend"
    - "back end"
    - "back-end"
    - "software engineer"
    - "software developer"
    - "sde"
    - "full stack"
    - "fullstack"
    - "full-stack"
    - "python"
    - "node"
    - "forward deployed"
    - "founding engineer"
    - "platform engineer"
    - "solutions engineer"
    - "member of technical staff"
    - "product engineer"
  negative:
    - "senior"
    - "sr."
    - "sr"
    - "staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "head of"
    - "architect"
    - "vp"
    - "intern"
    - "trainee"
    - "frontend"
    - "front end"
    - "front-end"
    - "android"
    - "ios"
    - "java developer"
    - ".net"
    - "dotnet"
    - "sap"
    - "salesforce"
    - "mainframe"
    - "qa"
    - "test engineer"
    - "sdet"
    - "data analyst"
    - "account executive"
    - "sales"
    - "marketing"
    - "recruiter"
    - "designer"
    - "support engineer"
    - "embedded"
    - "firmware"
    - "devops"
    - "sre"
    - "network"
    - "security analyst"
    - "iii"
    - "sde 3"
    - "sde-3"
    - "sde iii"
    - "java backend"
    - "java engineer"
    - "golang"
    - "go developer"
    - "php"
    - "ruby"
    - "c++"

location_filter:
  always_allow: ["India", "<your city>", "<your city>"]
  block: ["Thailand", "Colombia", "Argentina", "Chile", "Peru", "Taiwan", "New Zealand", "South Africa", "Nigeria", "Kenya", "Egypt", "UAE", "Dubai", "Saudi", "Italy", "Romania", "Czech", "Hungary", "Denmark", "Norway", "Finland", "Belgium", "Hong Kong", "Sweden", "Korea", "China", "Indonesia", "Switzerland", "Austria", "Portugal", "Japan", "Vietnam", "Malaysia", "Netherlands", "France", "Ireland", "Israel", "US-", "United States", "USA", "Canada", "United Kingdom", "Europe", "EMEA", "LATAM", "Americas", "Germany", "Brazil", "Mexico", "Australia", "Singapore", "Philippines", "Poland", "Spain"]
  allow: ["<your city>", "<your city>", "India", "Remote", "Anywhere", "Worldwide", "Global"]

